<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Alert Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: "Inter", sans-serif;
            /* Ghana Police Blue */
            background-color: #0a1128; /* A deep, strong blue */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px; /* Reduced padding for smaller screens */
            box-sizing: border-box; /* Ensure padding is included in total size */
        }
        .container {
            background-color: #ffffff; /* White container for readability */
            padding: 20px; /* Reduced padding for smaller screens */
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); /* Stronger shadow */
            width: 100%;
            max-width: 500px;
            box-sizing: border-box; /* Ensure padding is included in total size */
            display: flex; /* Use flexbox for centering content vertically */
            flex-direction: column; /* Stack children vertically */
            align-items: center; /* Center children horizontally */
        }

        /* Adjust container padding for larger screens */
        @media (min-width: 640px) { /* Tailwind's 'sm' breakpoint */
            .container {
                padding: 30px;
            }
             body {
                padding: 20px;
            }
        }

        .page {
            display: none; /* Hide pages by default */
            width: 100%; /* Ensure pages take full width of container */
        }
        .page.active {
            display: block; /* Show active page */
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, opacity 0.3s ease;
            font-weight: 600;
        }
        .btn-primary {
            /* Gold/Yellow accent color */
            background-color: #fcd34d; /* Amber 300 */
            color: #1a202c; /* Dark text for contrast */
            border: none;
        }
        .btn-primary:hover {
            background-color: #fbbf24; /* Amber 400 */
        }
         .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
             /* Dark Blue for secondary actions */
            background-color: #1e3a8a; /* Blue 800 */
            color: white;
            border: none;
        }
        .btn-secondary:hover {
            background-color: #172554; /* Blue 900 */
        }
         .btn-secondary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-danger {
            /* Police Red */
            background-color: #b91c1c; /* Red 700 */
            color: white;
            border: none;
        }
        .btn-danger:hover {
            background-color: #991b1b; /* Red 800 */
        }
         .btn-danger:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        input[type="text"], input[type="tel"], input[type="email"], textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db; /* Gray 300 */
            border-radius: 8px;
            box-sizing: border-box; /* Include padding and border in element's total width and height */
            background-color: #f9fafb; /* Light grey input background */
            color: #1f2937; /* Dark grey text */
        }
         input::placeholder, textarea::placeholder {
            color: #6b7280; /* Gray 500 */
            opacity: 1; /* Ensure placeholder is visible */
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #1f2937; /* Dark grey text for labels */
        }
        h1, h2, h3 {
            color: #1f2937; /* Dark grey for headings */
        }

        .logo {
            display: block; /* Make image a block element */
            margin: 0 auto 20px auto; /* Center image and add space below */
            max-width: 100px; /* Set a max width for the logo */
            height: auto; /* Maintain aspect ratio */
        }

        .round-button {
            width: 180px; /* Slightly larger default size */
            height: 180px; /* Slightly larger default size */
            background-color: #b91c1c; /* Police Red */
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem; /* Larger font size */
            font-weight: bold;
            cursor: pointer;
            border: none;
            box-shadow: 0 10px 20px rgba(185, 28, 28, 0.4); /* Stronger shadow */
            transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.1s ease;
            flex-shrink: 0; /* Prevent shrinking on small screens */
            text-align: center; /* Center text inside button */
            line-height: 1.2; /* Adjust line height */
        }

        /* Adjust round button size for smaller screens */
        @media (max-width: 480px) { /* Adjust breakpoint */
             .round-button {
                width: 150px;
                height: 150px;
                font-size: 1.2rem;
            }
        }

        .round-button:hover {
            background-color: #991b1b; /* Darker red on hover */
            box-shadow: 0 15px 25px rgba(153, 27, 27, 0.5); /* More prominent shadow on hover */
        }
        /* Animation class */
        .round-button:active {
            transform: scale(0.95); /* Slightly scale down when pressed */
            box-shadow: 0 5px 10px rgba(153, 27, 27, 0.6); /* Adjust shadow on press */
        }

        .message-box {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #34d399; /* Green 400 */
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 90%; /* Limit width on small screens */
            text-align: center;
            box-sizing: border-box;
        }
         .message-box.error {
            background-color: #f87171; /* Red 400 */
        }
         .message-box.active {
            display: block;
        }

        /* Custom class for top margin */
        .mt-10px {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://raw.githubusercontent.com/cofiemark/Security_systems/main/POLICE-LOGO-01.png" alt="Ghana Police Service Logo" class="logo">

        <h1 class="text-2xl font-bold text-center mb-6">Security Alert Demo</h1>

        <div id="page1" class="page active">
            <h2 class="text-xl font-semibold mb-4">Your Details</h2>
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required placeholder="e.g., Mark Cofie">

            <label for="phoneNumber">Phone Number:</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" required placeholder="e.g., +233 24 123 4567">

            <label for="houseLocation">House Location (Street Address, City):</label>
            <input type="text" id="houseLocation" name="houseLocation" required placeholder="e.g., 123 Main St, Accra">

            <label for="landmarks">Nearby Landmarks / Area Description:</label>
            <textarea id="landmarks" name="landmarks" rows="3" placeholder="e.g., Opposite the community park, near the blue gate"></textarea>

            <div class="flex justify-end mt-10px">
                <button class="btn btn-primary" onclick="nextPage()">Next</button>
            </div>
        </div>

        <div id="page2" class="page">
            <h2 class="text-xl font-semibold mb-4">Emergency Contacts</h2>

            <h3 class="text-lg font-medium mb-2 mt-4">Family Relative</h3>
            <label for="relativeName">Name:</label>
            <input type="text" id="relativeName" name="relativeName" placeholder="e.g., Uncle Kwame">
            <label for="relativePhone">Phone Number:</label>
            <input type="tel" id="relativePhone" name="relativePhone" placeholder="e.g., +233 27 333 4444">

            <h3 class="text-lg font-medium mb-2 mt-4">Neighbor 1</h3>
            <label for="neighbor1Name">Name:</label>
            <input type="text" id="neighbor1Name" name="neighbor1Name" placeholder="e.g., Ama Serwaa">
            <label for="neighbor1Phone">Phone Number:</label>
            <input type="tel" id="neighbor1Phone" name="neighbor1Phone" placeholder="e.g., +233 20 987 6543">

            <h3 class="text-lg font-medium mb-2 mt-4">Neighbor 2</h3>
            <label for="neighbor2Name">Name:</label>
            <input type="text" id="neighbor2Name" name="neighbor2Name" placeholder="e.g., Kofi Asante">
            <label for="neighbor2Phone">Phone Number:</label>
            <input type="tel" id="neighbor2Phone" name="neighbor2Phone" placeholder="e.g., +233 55 111 2222">

            <div class="flex justify-between mt-6 mt-10px">
                <button class="btn btn-secondary" onclick="prevPage()">Back</button>
                <button class="btn btn-primary" onclick="nextPage()">Next</button>
            </div>
        </div>

        <div id="page3" class="page">
            <h2 class="text-xl font-semibold text-center mb-6">Trigger Emergency Alert</h2>
            <p class="text-center text-gray-600 mb-8">
                Press the button below to simulate triggering the automated police alert system.<br>
                This will send your details to Make.com.
            </p>

            <div class="flex justify-center mb-8">
                 <button class="round-button" id="alertButton" onclick="sendWebhook()">
                    ALERT <br> POLICE
                </button>
            </div>


            <div class="flex justify-between">
                <button class="btn btn-secondary" onclick="prevPage()">Back</button>
                </div>
        </div>
    </div>

    <div id="messageBox" class="message-box"></div>

    <script src="config.js"></script>
    <script>
        let currentPage = 1;
        const totalPages = 3;
        // webhookUrl is now loaded from config.js
        const alertButton = document.getElementById('alertButton'); // Get the alert button

        // Function to show a specific page
        function showPage(pageNumber) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById('page' + pageNumber).classList.add('active');
            currentPage = pageNumber;
        }

        // Function to navigate to the next page
        function nextPage() {
            // Basic validation for required fields on Page 1 before moving
            if (currentPage === 1) {
                const fullName = document.getElementById('fullName').value.trim();
                const phoneNumber = document.getElementById('phoneNumber').value.trim();
                const houseLocation = document.getElementById('houseLocation').value.trim();

                if (!fullName || !phoneNumber || !houseLocation) {
                    showMessage("Please fill out all required fields on this page.", 'error');
                    return;
                }
            }

            if (currentPage < totalPages) {
                showPage(currentPage + 1);
            }
        }

        // Function to navigate to the previous page
        function prevPage() {
            if (currentPage > 1) {
                showPage(currentPage - 1);
            }
        }

        // Function to collect data and send webhook
        async function sendWebhook() {
            // Collect all data from the forms
            const userData = {
                fullName: document.getElementById('fullName').value.trim(),
                phoneNumber: document.getElementById('phoneNumber').value.trim(),
                houseLocation: document.getElementById('houseLocation').value.trim(),
                landmarks: document.getElementById('landmarks').value.trim(),
                emergencyContacts: {
                    relative: { // Moved relative to the top as requested in the previous turn
                         name: document.getElementById('relativeName').value.trim(),
                         phone: document.getElementById('relativePhone').value.trim()
                     },
                    neighbor1: {
                        name: document.getElementById('neighbor1Name').value.trim(),
                        phone: document.getElementById('neighbor1Phone').value.trim()
                    },
                    neighbor2: {
                        name: document.getElementById('neighbor2Name').value.trim(),
                        phone: document.getElementById('neighbor2Phone').value.trim()
                    }
                }
                // Add other relevant data here if needed, e.g., timestamp, system status
            };

             // Basic validation before sending
            if (!userData.fullName || !userData.phoneNumber || !userData.houseLocation) {
                 showMessage("User details are incomplete. Please go back to Page 1.", 'error');
                 return;
            }

            // Confirm before sending (optional but good for demo)
            const confirmSend = confirm("Are you sure you want to simulate sending an emergency alert?");
            if (!confirmSend) {
                return;
            }

            showMessage("Sending emergency alert...", 'info'); // Show sending message

            // Add active class to trigger animation
            alertButton.classList.add('sending'); // Add a class to indicate sending state (optional for more complex animations)
            alertButton.disabled = true; // Disable button while sending


            try {
                // Use the webhookUrl variable loaded from config.js
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    showMessage("Emergency alert sent successfully!", 'success');
                    // Optionally reset form or navigate to a confirmation page
                     setTimeout(() => {
                         // Simple reset for demo
                         document.getElementById('fullName').value = '';
                         document.getElementById('phoneNumber').value = '';
                         document.getElementById('houseLocation').value = '';
                         document.getElementById('landmarks').value = '';
                         document.getElementById('relativeName').value = '';
                         document.getElementById('relativePhone').value = '';
                         document.getElementById('neighbor1Name').value = '';
                         document.getElementById('neighbor1Phone').value = '';
                         document.getElementById('neighbor2Name').value = '';
                         document.getElementById('neighbor2Phone').value = '';
                         showPage(1); // Go back to the start
                     }, 3000); // Reset after 3 seconds
                } else {
                    const errorText = await response.text();
                    showMessage(`Failed to send alert: ${response.status} ${response.statusText} - ${errorText}`, 'error');
                }
            } catch (error) {
                showMessage(`An error occurred: ${error.message}`, 'error');
            } finally {
                 // Remove active class after request is complete (success or failure)
                 alertButton.classList.remove('sending');
                 alertButton.disabled = false; // Re-enable button
            }
        }

        // Function to display temporary messages
        function showMessage(message, type = 'info') {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = message;
            messageBox.className = 'message-box active ' + type; // Reset classes and add type

            // Hide after a few seconds
            setTimeout(() => {
                messageBox.classList.remove('active');
                 messageBox.className = 'message-box'; // Reset classes
            }, 5000); // Hide after 5 seconds
        }


        // Show the first page on load
        document.addEventListener('DOMContentLoaded', () => {
            showPage(1);
        });

    </script>

</body>
</html>
